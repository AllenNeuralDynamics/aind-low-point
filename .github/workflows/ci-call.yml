name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Quoted: YAML reads an unquoted 3.10 as the number 3.1.
        python-version: ["3.11", "3.13"]

    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.actor != 'github-actions[bot]' &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bump:'))

    uses: AllenNeuralDynamics/galen-uv-workflows/.github/workflows/ci.yml@main
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      package-name: aind_rutter
      # The wheel smoke test walks every submodule, and everything under
      # optimization/ imports JAX at module level, so the minimal wheel cannot
      # import 22 of them. Keeping JAX lazy there is not worth it: the solver
      # is the package's other half, not an optional accessory.
      smoke-extras: optimization
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
