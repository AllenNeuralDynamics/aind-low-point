name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Quoted: YAML reads an unquoted 3.10 as the number 3.1.
        python-version: ["3.11", "3.13"]

    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.actor != 'github-actions[bot]' &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bump:'))

    uses: AllenNeuralDynamics/galen-uv-workflows/.github/workflows/ci.yml@main
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      package-name: aind_rutter
      # The wheel smoke test walks every submodule, and everything under
      # optimization/ imports JAX at module level, so the minimal wheel cannot
      # import 22 of them. Keeping JAX lazy there is not worth it: the solver
      # is the package's other half, not an optional accessory.
      smoke-extras: optimization
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}

  # Packs read and write a cache on the user's machine, so their file handling
  # runs where renames, path rules and certificates differ. The rest of the
  # stack has no wheels for every platform, hence the minimal install.
  packs-portable:
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pack tests
        env:
          PYTHONPATH: src
        run: >
          uv run --no-project --python 3.13
          --with pytest --with pytest-xdist --with pydantic-settings
          --with platformdirs --with certifi
          pytest -q tests/test_packs.py
